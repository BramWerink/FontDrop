name: Desktop app

on:
  # Handmatig draaien: Actions -> Desktop app -> Run workflow.
  workflow_dispatch:
  # Een versie-tag (bv. v0.2.0) publiceert ook een GitHub Release met de installer.
  push:
    tags: ['v*']
  # Testen dat de build niet breekt als relevante bestanden wijzigen.
  pull_request:
    paths:
      - 'fontdrop/**'
      - 'run_fontdrop.py'
      - 'installer.iss'
      - 'requirements.txt'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --name FontDrop --windowed --noconfirm run_fontdrop.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: fontdrop-windows-installer
          path: installer_output/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          installer_output/*.exe
          --title "FontDrop $GITHUB_REF_NAME"
          --generate-notes
